[General]
	#The brand name displayed in auth messages.
	brandName = "NeoLogin"
	#The language of the mod (en or ru).
	language = "en"

["Security & Limits"]
	#Time in seconds given to player to login or register before getting kicked.
	# Default: 60
	# Range: 10 ~ 600
	authTimeoutSeconds = 60
	#Maximum incorrect login attempts before getting kicked.
	# Default: 3
	# Range: 1 ~ 10
	maxLoginAttempts = 3

[Database]
	#Database type: 'sqlite' or 'mysql'. Default: sqlite.
	databaseType = "sqlite"
	#MySQL host address (only used when databaseType is 'mysql').
	mysqlHost = "localhost"
	#MySQL port (only used when databaseType is 'mysql').
	# Default: 3306
	# Range: 1 ~ 65535
	mysqlPort = 3306
	#MySQL database name (only used when databaseType is 'mysql').
	mysqlDatabase = "neologin"
	#MySQL username (only used when databaseType is 'mysql').
	mysqlUsername = "root"
	#MySQL password (only used when databaseType is 'mysql').
	mysqlPassword = ""

[Updates]
	#Check for mod updates on Modrinth when the server starts. Set to false to disable.
	checkUpdates = true
